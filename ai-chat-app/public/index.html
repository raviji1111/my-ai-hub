<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1>🤖 My AI Hub</h1>
      <p>Apne saare AI models ek jagah</p>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <button class="secondary" onclick="register()">Naya Account Banayein</button>
      <p class="hint">Pehli baar? Username/password daal kar "Naya Account Banayein" dabayein</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>💬 Chats</h2>
        <button onclick="newChat()">+ Nayi Chat</button>
      </div>
      <div id="chatList" class="chat-list"></div>
      <div class="sidebar-footer">
        <button onclick="openSettings()">⚙️ API Keys</button>
        <button onclick="logout()">🚪 Logout</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <select id="modelSelect"></select>
        <span id="userBadge"></span>
      </div>
      <div id="messages" class="messages">
        <div class="welcome"><h2>Namaste! 👋</h2><p>Model chunein aur chat karein.</p></div>
      </div>
      <div class="input-area">
        <textarea id="userInput" placeholder="Message likhein..." rows="1"></textarea>
        <button onclick="sendMessage()" id="sendBtn">➤</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <h2>⚙️ API Keys</h2>
      <p class="hint">Apni API keys daalein. Ye aapke browser mein safe save hoti hain.</p>
      <div id="apiKeyFields"></div>
      <div class="modal-actions">
        <button onclick="saveSettings()">💾 Save</button>
        <button class="secondary" onclick="closeSettings()">Band karein</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
